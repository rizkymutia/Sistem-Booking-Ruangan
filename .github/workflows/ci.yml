name: SpaceSync CI

on:
  push:
    branches:
      - aplikasi-lengkap
      - "fix/**"
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - aplikasi-lengkap
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spacesync-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, ESLint, Prisma & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This is an isolated database created by GitHub Actions.
    # Never put production credentials in this workflow.
    env:
      DATABASE_URL: postgresql://spacesync_ci:spacesync_ci@127.0.0.1:5432/spacesync_ci?schema=public
      JWT_SECRET: ci-only-test-secret-not-for-production-2026
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spacesync_ci
          POSTGRES_PASSWORD: spacesync_ci
          POSTGRES_DB: spacesync_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U spacesync_ci -d spacesync_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate database migrations on CI PostgreSQL
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
